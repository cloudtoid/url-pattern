name: build

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
   
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build - Release
        run: dotnet build -c Release UrlPattern.sln

      - name: Test - Debug
        run: dotnet test UrlPattern.sln